apply plugin: 'com.android.application'

android {
    namespace 'com.AndFlmsg'

    // AGP 8 disables BuildConfig by default; AndFlmsg.java uses
    // BuildConfig.APPLICATION_ID, so it must stay enabled.
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility 1.8
        targetCompatibility 1.8
    }
    // Keep compileSdk, buildToolsVersion, and ndkVersion in sync with
    // container/Containerfile: the image installs exactly these versions.
    compileSdk 35
    buildToolsVersion "35.0.0"
    ndkVersion "21.4.7075529"


    defaultConfig {
        applicationId "com.AndFlmsg"
        minSdk 23
        targetSdk 33
        versionCode 2
        versionName "1.7.0.0"
        externalNativeBuild {
            ndkBuild {
                abiFilters 'armeabi-v7a','arm64-v8a'
                cFlags "-DHAVE_STRCASESTR"
            }
        }
   }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt')
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    lint {
        disable 'MissingTranslation'
        checkReleaseBuilds false
        //abortOnError false
    }
}

dependencies {
    //implementation 'com.android.support:support-v4:28.0.0'
    //implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.0'
    implementation 'androidx.activity:activity:1.6.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    //implementation "androidx.documentfile:documentfile:1.1.0"
}
