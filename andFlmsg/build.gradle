apply plugin: 'com.android.application'

// Single source of truth for versionCode/versionName/versionDate.
// Release tags must match v<versionName>; see docs/RELEASING.md.
def versionFile = rootProject.file('version.properties')
if (!versionFile.isFile()) {
    throw new GradleException("Missing version.properties at ${versionFile}")
}
def versionProps = new Properties()
versionFile.withInputStream { versionProps.load(it) }

def versionCodeText = versionProps.getProperty('versionCode', '').trim()
def versionNameText = versionProps.getProperty('versionName', '').trim()
def versionDateText = versionProps.getProperty('versionDate', '').trim()
if (!(versionCodeText ==~ /\d+/) || versionNameText.isEmpty() || versionDateText.isEmpty()) {
    throw new GradleException(
        'version.properties must define an integer versionCode plus versionName and versionDate')
}
def appVersionCode = versionCodeText.toInteger()
def appVersionName = versionNameText

// Release signing comes from CI environment variables only. Local debug builds
// do not need it, and release tasks fail closed when it is absent.
def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def hasReleaseSigning = [releaseKeystorePath, releaseKeystorePassword,
                         releaseKeyAlias, releaseKeyPassword].every {
    it != null && !it.trim().isEmpty()
}
if (hasReleaseSigning && !new File(releaseKeystorePath).isFile()) {
    throw new GradleException(
        "ANDROID_KEYSTORE_PATH does not point to a file: ${releaseKeystorePath}")
}

android {
    namespace 'com.AndFlmsg'

    // AGP 8 disables BuildConfig by default; AndFlmsg.java uses
    // BuildConfig.APPLICATION_ID, so it must stay enabled.
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility 1.8
        targetCompatibility 1.8
    }
    // Keep compileSdk, buildToolsVersion, and ndkVersion in sync with
    // container/Containerfile: the image installs exactly these versions.
    compileSdk 35
    buildToolsVersion "35.0.0"
    ndkVersion "21.4.7075529"


    defaultConfig {
        applicationId "com.AndFlmsg"
        minSdk 23
        targetSdk 33
        versionCode appVersionCode
        versionName appVersionName
        // Release date for versionName, displayed by Processor.version.
        // Both values come from version.properties.
        buildConfigField "String", "VERSION_DATE", "\"${versionDateText}\""
        externalNativeBuild {
            ndkBuild {
                abiFilters 'armeabi-v7a','arm64-v8a'
                cFlags "-DHAVE_STRCASESTR"
            }
        }
   }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storeType 'PKCS12'
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt')
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    lint {
        disable 'MissingTranslation'
        checkReleaseBuilds false
        //abortOnError false
    }
}

// Fail closed. Debug builds and lint are unaffected, but any release packaging
// task needs all four signing environment variables.
def appProjectPath = project.path
gradle.taskGraph.whenReady { graph ->
    if (hasReleaseSigning) {
        return
    }
    def releaseTask = graph.allTasks.find { task ->
        task.project.path == appProjectPath &&
            task.name ==~ /(?i)(assemble|bundle|package|install|sign).*release.*/
    }
    if (releaseTask != null) {
        throw new GradleException(
            "Release signing is not configured. Set ANDROID_KEYSTORE_PATH, " +
            "ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD. " +
            "See docs/RELEASING.md.")
    }
}

dependencies {
    //implementation 'com.android.support:support-v4:28.0.0'
    //implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.0'
    implementation 'androidx.activity:activity:1.6.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    //implementation "androidx.documentfile:documentfile:1.1.0"
}
