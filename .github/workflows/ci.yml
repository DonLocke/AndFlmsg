name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 16111833
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;21.4.7075529

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: ./gradlew :andFlmsg:assembleDebug

      - name: Lint
        run: ./gradlew :andFlmsg:lintDebug :andFlmsg:lintRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: andflmsg-debug
          path: andFlmsg/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
