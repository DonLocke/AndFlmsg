apply plugin: 'com.android.library'

android {
    namespace 'ar.com.daidalos.afiledialog'

    compileSdkVersion 33
    buildToolsVersion "33.0.2"

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 33
